# Secret · rank 15 · account-scoped credential store.
# Every secret-bearing config below points at one of these by `secretKeyRef`.
# Between them these files exercise all six secret sources. Every one of them is
# resolved by gitops_apply.py before upload and then sealed to the instance's
# public key — the server resolves none of them, so nothing here reaches it as a
# reference.
#   stringData             — inline plaintext
#   data                   — inline base64
#   fromEnv                — an environment variable of the applying shell / CI job
#   fromGcpSecretManager   — GCP Secret Manager
#   fromAwsSecretsManager  — AWS Secrets Manager
#   fromAzureKeyVault      — Azure Key Vault
apiVersion: ragnerock.com/v1alpha1
kind: Secret
metadata:
  name: llm_credentials
spec:
  description: BYOAI provider API keys
  stringData:
    anthropicApiKey: "sk-ant-REPLACE_ME"
  fromEnv:
    # Set GEMINI_EMBED_KEY in your shell / CI before applying, e.g.
    #   export GEMINI_EMBED_KEY=...   (or a GitHub Actions secret)
    geminiEmbedKey: GEMINI_EMBED_KEY
  fromAzureKeyVault:
    # Needs Azure credentials in the environment (azure/login in CI, or
    # `az login` locally). `vaultUrl` is the full URL, so sovereign clouds work
    # without extra configuration. `jsonField` pulls one field out of a secret
    # holding a JSON object — the shape cloud tooling tends to produce.
    openaiApiKey:
      vaultUrl: https://REPLACE-ME.vault.azure.net
      secret: openai-credentials
      jsonField: apiKey
---
apiVersion: ragnerock.com/v1alpha1
kind: Secret
metadata:
  name: blob_credentials
spec:
  description: Object-store credentials (shared by BlobProviderConfig + IngestConfig)
  fromAwsSecretsManager:
    # Needs AWS credentials in the environment (aws-actions/configure-aws-credentials
    # in CI, or a local profile). `region` is optional when one is configured
    # ambiently; `secretId` takes a name or a full ARN.
    aws:
      secretId: ragnerock/blob-credentials
      region: us-east-1
---
apiVersion: ragnerock.com/v1alpha1
kind: Secret
metadata:
  name: db_credentials
spec:
  description: Warehouse credentials (BigQuery service account + Postgres DSN)
  data:
    # base64 of {"type": "service_account", "project_id": "REPLACE_ME"}
    credentials.json: "eyJ0eXBlIjogInNlcnZpY2VfYWNjb3VudCIsICJwcm9qZWN0X2lkIjogIlJFUExBQ0VfTUUifQ=="
  fromGcpSecretManager:
    # Needs Google credentials in the environment (google-github-actions/auth in
    # CI, or `gcloud auth application-default login` locally). `secret` takes a
    # short ID — with `project` defaulting to the ADC project — or a full
    # `projects/<p>/secrets/<s>[/versions/<v>]` resource name pasted from the
    # console.
    pgDsn:
      secret: warehouse-pg-dsn
      project: REPLACE_ME
      version: latest
