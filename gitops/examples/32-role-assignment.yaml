# RoleAssignment · rank 32 · account-scoped. `role` references the Role above.
# This is the only place a role's members and teams are expressed.
apiVersion: ragnerock.com/v1alpha1
kind: RoleAssignment
metadata:
  name: quant_researchers_binding
spec:
  description: "Who is in the quant research role"
  role: quant_researchers
  members:
    - john@ragnerock.com
    - jane@ragnerock.com
    - newhire@ragnerock.com
  teams:
    - research
