# Snapshot · rank 85 · project-scoped · not foldered.
# Self-contained frozen pipeline: agents (+ their output schema) and the workflow
# are embedded INLINE, so it does not depend on the live Agent/Workflow/Schema
# objects above. `endpoint` must match the Endpoint's metadata.name below so that
# Endpoint's `snapshot: latest` binds to this snapshot.
apiVersion: ragnerock.com/v1alpha1
kind: Snapshot
metadata:
  name: sentiment-api-v1
  annotations:
    ragnerock.com/project: alpha-research
spec:
  endpoint: sentiment-api
  sourceWorkflow: filing-pipeline
  includeContent: false
  returnFields:
    - node: sentiment
      field: score
  agents:
    - name: extract-sentiment
      generationPrompt: |
        Score the sentiment of this text from -1 to 1 and justify.
      chunkType: paragraph
      jsonSchema:
        type: object
        properties:
          score: { type: number }
        required: [score]
  workflow:
    isActive: true
    autoRunOnUpload: false
    nodes:
      - name: sentiment
        agent: extract-sentiment
        dependsOn: []
