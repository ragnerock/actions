# Endpoint · rank 90 · project-scoped · not foldered.
# `snapshot: latest` binds to the Snapshot above (whose `endpoint` == this name).
apiVersion: ragnerock.com/v1alpha1
kind: Endpoint
metadata:
  name: sentiment-api
  annotations:
    ragnerock.com/project: alpha-research
spec:
  description: "Public sentiment scoring endpoint"
  snapshot: latest
  isEnabled: true
  acceptedFileTypes: [pdf, txt]
  ephemeral: true
  rateLimitRpm: 60
  ipWhitelist:
    - 203.0.113.0/24
